<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Activate booking emails | Exotic Earthworks</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#faf8f3;color:#1f2328;padding:24px;box-sizing:border-box}
  .card{background:#fff;border:1px solid #e3ded2;border-radius:14px;padding:28px;max-width:440px;text-align:center}
  button{background:#800020;color:#fff;border:0;border-radius:10px;padding:14px 24px;font:700 17px system-ui,sans-serif;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h1 style="margin:0 0 8px;font-size:22px">Activate booking emails</h1>
  <p>Click the button once. FormSubmit will then email <b>ashveer.sewlal@gmail.com</b> an activation link.</p>
  <form action="https://formsubmit.co/ashveer.sewlal@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="Exotic Earthworks website – activation test">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://exoticearthworks.com.au/activate.html?sent=1">
    <input type="hidden" name="name" value="Exotic Earthworks website">
    <input type="hidden" name="message" value="Activation test from the website setup.">
    <button type="submit">Send activation email</button>
  </form>
</div>
</body>
</html>
